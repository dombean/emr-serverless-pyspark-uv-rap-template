[project]
name = "emr-serverless-pyspark-uv-rap-template"
version = "0.0.0"
description = "Minimal uv-managed PySpark package with EMR Serverless deploy CLI."
readme = "README.md"
requires-python = ">=3.9,<3.12"
authors = [{ name = "Your Name", email = "you@example.com" }]

dependencies = [
    "boto3>=1.34",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "rdsa-utils>=0.14.1",
    "tomli>=2.2.1",
]

[project.optional-dependencies]
# Local development + Spark Connect client.
# - pyspark[connect] is the Spark Connect client; its version MUST match the
#   Spark version on your EMR Serverless application (3.5.6 for emr-7.13.0).
# - boto3 1.43+ adds the EMR Serverless session APIs, but requires Python
#   3.10+. The EMR image itself runs Python 3.9, so this floor is dev-only
#   (gated by a marker) and does not affect the deployed package.
dev = [
    "pyspark[connect]==3.5.6",
    "boto3>=1.43; python_version >= '3.10'",
    "pre-commit",
    "black",
    "ruff",
    "isort",
    "pytest",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.scripts]
deploy-to-emr = "emr_dummy.emr.deploy_cli:deploy"
spark-connect = "emr_dummy.emr.spark_connect_cli:cli"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
