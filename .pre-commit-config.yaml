repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)(
            ^.github/
          )
        exclude_types: [markdown, yaml, toml]
      - id: end-of-file-fixer
        exclude: |
          (?x)(
            ^.github/
          )
        exclude_types: [markdown, yaml, toml]
      - id: check-docstring-first
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
        # examples/debug_local.py uses breakpoint() on purpose.
        exclude: ^examples/

  - repo: https://github.com/psf/black
    rev: 26.5.1 # Using a more recent version
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17 # Using a more recent version
    hooks:
      - id: ruff
        args: ["--config", ".ruff.toml"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0 # Using a more recent version
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: restricted-filenames
        name: Check commits for restricted file extensions
        entry: These file extensions are restricted. Data should be removed from the commit
        language: fail
        files: .*\.(csv|feather|xlsx|zip|hdf5|h5|txt|json|xml|hd|parquet)
        # Editor configuration is not data; the remote debugging guide
        # recommends committing .vscode/launch.json.
        exclude: ^\.vscode/
